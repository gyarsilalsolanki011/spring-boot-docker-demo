version: '3.8'

services:

  mymongodb:
    image: mongo
    container_name: "mymongodb"
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: qwerty
    volumes:
      - E:\Device File\OneDrive\Desktop\data\springboot-mongo-data:/data/db

  mongo-express:
    image: mongo-express
    container_name: "mongo-express"
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: qwerty
      ME_CONFIG_MONGODB_URL: mongodb://admin:qwerty@mymongodb:27017/
      ME_CONFIG_BASICAUTH: true

  springboot-mongo-demo:
    image: gyarsilalsolanki011/springboot-mongo-demo:1.0
    container_name: "springboot-mongo-demo"
    ports:
      - '8080:8080'
    links:
      - mymongodb