version: '3.8'

services:

  my-mongodb:
    image: mongo
    container_name: "my-mongodb"
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: qwerty
    volumes:
      - E:\Device File\OneDrive\Desktop\data\spring-boot-docker-data:/data/db

  mongo-express:
    image: mongo-express
    container_name: "mongo-express"
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: qwerty
      ME_CONFIG_MONGODB_URL: mongodb://admin:qwerty@mymongodb:27017/
      ME_CONFIG_BASICAUTH: true

  spring-boot-docker-demo:
    image: gyarsilalsolanki011/spring-boot-docker-demo:latest
    container_name: "spring-boot-docker-demo"
    ports:
      - '8080:8080'
    links:
      - my-mongodb